name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Pages
        uses: actions/configure-pages@v6
      - name: Build attack speed reference data
        run: python3 scripts/build_attack_speed_data.py
      - name: Version browser assets
        shell: python
        run: |
          from pathlib import Path
          import hashlib

          root = Path('public')
          assets = [asset for asset in (root / 'assets').rglob('*') if asset.suffix in ('.js', '.css')]
          for index in root.rglob('*.html'):
              html = index.read_text(encoding='utf-8')
              for asset in assets:
                  path = asset.relative_to(root).as_posix()
                  version = hashlib.sha256(asset.read_bytes()).hexdigest()[:16]
                  html = html.replace(f'"{path}"', f'"{path}?v={version}"')
              index.write_text(html, encoding='utf-8')
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: public
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
